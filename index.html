<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0910">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="cnation Slay the Spire - 모바일 로그라이크 덱빌더">
<title>cnation STS — 첨탑을 오르다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Kirang+Haerang&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app">
  <!-- ============ 타이틀 ============ -->
  <section class="screen" id="scr-title">
    <div class="title-bg"></div>
    <div class="title-head">
      <h1 class="game-title"><b class="brand">cnation</b><span>Slay the Spire</span></h1>
    </div>
    <div class="title-stage">
      <canvas id="title-canvas"></canvas>
    </div>
    <div class="title-wrap">
      <div class="title-menu">
        <button class="btn big" id="btn-new">새 게임</button>
        <button class="btn big ghost" id="btn-continue">이어하기</button>
        <div class="title-menu-row">
          <button class="btn ghost" id="btn-help">게임 방법</button>
          <button class="btn ghost" id="btn-codex">백과사전</button>
        </div>
      </div>
      <div class="title-foot">원작 규칙 재현 · 아이언클래드 75종 카드 · 몬스터 57종</div>
    </div>
    <div class="version-bar">
      <span class="version-num" id="version-badge"></span>
      <a class="version-link" id="link-history" href="#">Revision History</a>
    </div>
  </section>

  <!-- ============ 지도 ============ -->
  <section class="screen" id="scr-map" hidden>
    <header class="topbar" id="map-top"></header>
    <div class="map-legend" id="map-legend"></div>
    <div class="map3d-wrap">
      <canvas id="map-canvas"></canvas>
      <div class="map-title-3d" id="map-title-3d"></div>
      <div class="map-hint" id="map-hint">위아래로 밀어 둘러보고, 빛나는 방을 탭하세요</div>
    </div>
    <footer class="mapfoot">
      <button class="btn sm" id="btn-deck">덱 보기</button>
      <button class="btn sm ghost" id="btn-settings">설정</button>
    </footer>
  </section>

  <!-- ============ 전투 ============ -->
  <section class="screen" id="scr-battle" hidden>
    <header class="topbar" id="battle-top"></header>
    <div class="stage">
      <canvas id="three-canvas"></canvas>
      <div class="overlay" id="stage-overlay"></div>
      <div class="float-layer" id="float-layer"></div>
      <div class="battle-log" id="battle-log"></div>
    </div>
    <div class="handbar">
      <div class="hand-side left">
        <button class="pile-btn" id="btn-draw"><span class="pile-label">뽑을</span><span class="pile-num" id="draw-count">0</span></button>
      </div>
      <div class="hand" id="hand"></div>
      <div class="hand-side right">
        <button class="pile-btn" id="btn-discard"><span class="pile-label">버린</span><span class="pile-num" id="discard-count">0</span></button>
        <button class="pile-btn" id="btn-exhaust"><span class="pile-label">소각</span><span class="pile-num" id="exhaust-count">0</span></button>
      </div>
    </div>
    <div class="actionbar">
      <div class="energy-orb" id="energy-orb">
        <svg viewBox="0 0 60 60"><defs>
          <radialGradient id="eo" cx="0.4" cy="0.35" r="0.75">
            <stop offset="0" stop-color="#fff6c8"/><stop offset="0.45" stop-color="#ffb13a"/><stop offset="1" stop-color="#7a3a08"/>
          </radialGradient></defs>
          <circle cx="30" cy="30" r="26" fill="url(#eo)" stroke="#20140a" stroke-width="3"/>
          <circle cx="30" cy="30" r="20" fill="none" stroke="#fff0b0" stroke-opacity="0.35" stroke-width="1.5"/>
        </svg>
        <span id="energy-text">3/3</span>
      </div>
      <button class="btn end-turn" id="btn-endturn">턴 종료</button>
    </div>
    <!-- 화면 맨 아래 빈 영역 : 탭하면 선택한 카드가 취소된다 (별도 표시 없음) -->
    <div class="cancel-zone" id="cancel-zone"></div>
  </section>

  <!-- ============ 변경 이력 ============ -->
  <section class="screen" id="scr-history" hidden>
    <header class="history-top">
      <h2>Revision History</h2>
      <span class="history-credit">제작 : cnation(문명국)</span>
      <button class="btn sm" id="btn-history-home">홈으로</button>
    </header>
    <div class="history-body" id="history-body"></div>
  </section>

  <!-- ============ 백과사전 ============ -->
  <section class="screen" id="scr-codex" hidden>
    <header class="history-top">
      <h2 id="codex-title">백과사전</h2>
      <button class="btn sm" id="btn-codex-close">닫기</button>
    </header>
    <div class="codex-tabs" id="codex-tabs"></div>
    <div class="codex-sub" id="codex-sub"></div>
    <div class="history-body" id="codex-body"></div>
  </section>

  <!-- ============ 범용 모달/오버레이 화면 ============ -->
  <section class="screen modal-screen" id="scr-modal" hidden>
    <div class="modal-status" id="modal-status" hidden></div>
    <div class="modal-box" id="modal-box"></div>
  </section>

  <div class="toast-layer" id="toast-layer"></div>
  <div class="tooltip" id="tooltip" hidden></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
